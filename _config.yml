# ============================================================
# 站点基础配置
# ============================================================

# 博客名称（显示在页头，红色大字）
title: 大家好我是尹煜同学

# 站点地址
url: "https://dreameryin.com"

# 站点描述（SEO 用）
description: 分享人工智能、虚幻引擎、Unity引擎、软件开发等技术经验

# 时区
timezone: Asia/Shanghai

# 文章永久链接格式：/202611/文章名.html（仿 gov.cn 风格）
permalink: /:year:month/:title.html

# Markdown 渲染器与代码高亮
markdown: kramdown
highlighter: rouge

# ============================================================
# 专题集合（collection）
#   每个专题一个文件放在 _topics/ 下，文件名即全局唯一 slug（分类前缀，避免重名）
#   专题 front matter 字段：title(中文名)/category(归属分类)/cover(封面图)/description(简介)/order(排序)
#   自动生成专题页 URL：/topics/<文件名>.html
# ============================================================
collections:
  topics:
    output: true

# ============================================================
# 栏目配置（页头导航 + 首页栏目块都由这里驱动）
# 新增分类只需四步：
#   1. 在下面加一项（slug 用英文，name 用中文显示名）
#   2. 在 categories/ 目录复制一个现有分类页，改里面两个字段
#   3. 在 _posts/ 下建一个与 name 同名的子文件夹（该分类的文章放这里）
#   4. 在下方 defaults 里加一条该文件夹的 categories 注入规则
# ============================================================
sections:
  - slug: ai
    name: 人工智能
  - slug: ue
    name: 虚幻引擎
  - slug: unity
    name: Unity引擎
  - slug: architecture
    name: 软件开发
    nav: false          # false = 不显示在页头导航（首页栏目块和分类页仍然保留）

# ============================================================
# 文章默认值
#   1) _posts/ 下的文章自动使用 post 布局
#   2) 按所在子文件夹自动注入分类（Jekyll 并不会自动把子文件夹名当分类，
#      必须在这里显式声明；新增分类时需同步加一条对应规则）
# ============================================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_posts/人工智能"
    values:
      categories: ["人工智能"]
  - scope:
      path: "_posts/虚幻引擎"
    values:
      categories: ["虚幻引擎"]
  - scope:
      path: "_posts/Unity引擎"
    values:
      categories: ["Unity引擎"]
  - scope:
      path: "_posts/软件开发"
    values:
      categories: ["软件开发"]
  - scope:
      path: "_posts/关于我"
    values:
      categories: ["关于我"]
  - scope:
      path: ""
      type: topics
    values:
      layout: list

# 不参与构建的文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
