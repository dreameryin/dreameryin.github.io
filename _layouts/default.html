<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="/assets/images/logo.jpg">
  <link rel="stylesheet" href="/assets/css/style.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body>

  <!-- 全站统一页头 -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="/">
        <img class="site-logo" src="/assets/images/logo.jpg" alt="{{ site.title }}">
        <span class="site-brand-text">
          <span class="site-title">{{ site.title }}</span>
          <span class="site-domain">dreameryin.github.io</span>
        </span>
      </a>
      <form class="header-search" action="/search.html" method="get">
        <input type="text" name="q" placeholder="请输入关键词" autocomplete="off">
        <button type="submit" aria-label="搜索">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
        </button>
      </form>
      <nav class="site-nav">
        <a href="/">首页</a>
        {%- for section in site.sections %}
        <span class="nav-sep">｜</span><a href="/categories/{{ section.slug }}.html">{{ section.name }}</a>
        {%- endfor %}
        <span class="nav-sep">｜</span><a href="/about.html">关于我</a>
      </nav>
    </div>
  </header>

  <!-- 页面主体 -->
  <main class="site-main">
    {{ content }}
  </main>

  <!-- 全站统一页脚 -->
  <footer class="site-footer">
    <div class="container">&copy; 2026 {{ site.title }} ｜ Powered by GitHub Pages</div>
  </footer>

</body>
</html>
