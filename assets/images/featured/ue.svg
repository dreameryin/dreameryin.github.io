<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#082f49"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- 低多边形球体（线框三角面） -->
  <g stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.65" fill="none">
    <!-- 顶部三角扇 -->
    <path d="M320 82 L262 122 L378 122 Z"/>
    <path d="M320 82 L378 122 L412 182 Z"/>
    <path d="M320 82 L262 122 L228 182 Z"/>
    <!-- 中部 -->
    <path d="M262 122 L228 182 L262 238 Z"/>
    <path d="M378 122 L412 182 L378 238 Z"/>
    <path d="M320 82 L228 182 L320 200 Z"/>
    <path d="M320 82 L412 182 L320 200 Z"/>
    <!-- 底部三角扇 -->
    <path d="M320 278 L262 238 L378 238 Z"/>
    <path d="M320 278 L228 182 L262 238 Z"/>
    <path d="M320 278 L412 182 L378 238 Z"/>
    <!-- 中环连线 -->
    <path d="M228 182 L320 200 L412 182"/>
    <path d="M262 122 L320 200 L262 238"/>
    <path d="M378 122 L320 200 L378 238"/>
  </g>

  <!-- 少量高亮填充面 -->
  <g fill="#67e8f9" fill-opacity="0.12" stroke="none">
    <path d="M320 82 L262 122 L378 122 Z"/>
    <path d="M320 278 L262 238 L378 238 Z"/>
  </g>

  <!-- 顶点 -->
  <g fill="#a5f3fc">
    <circle cx="320" cy="82" r="4"/><circle cx="320" cy="278" r="4"/>
    <circle cx="262" cy="122" r="3"/><circle cx="378" cy="122" r="3"/>
    <circle cx="228" cy="182" r="3"/><circle cx="412" cy="182" r="3"/>
    <circle cx="262" cy="238" r="3"/><circle cx="378" cy="238" r="3"/>
    <circle cx="320" cy="200" r="3"/>
  </g>

  <!-- 底部光栅 -->
  <g stroke="#67e8f9" stroke-opacity="0.3">
    <line x1="120" y1="320" x2="520" y2="320"/>
    <line x1="140" y1="332" x2="500" y2="332"/>
  </g>
</svg>
