<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- 网格装饰 -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="220" x2="640" y2="220"/>
    <line x1="130" y1="0" x2="130" y2="360"/>
    <line x1="510" y1="0" x2="510" y2="360"/>
  </g>

  <!-- 装饰圆环 -->
  <circle cx="320" cy="140" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 六边形 + 能力星形（GAS 图标） -->
  <g>
    <polygon points="320,84 368,112 368,168 320,196 272,168 272,112"
             fill="none" stroke="#67e8f9" stroke-width="3" stroke-opacity="0.9"/>
    <polygon points="320,108 340,128 340,152 320,172 300,152 300,128"
             fill="#fbbf24" stroke="#fde68a" stroke-width="2"/>
  </g>

  <!-- 标题 -->
  <text x="320" y="268" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">虚幻引擎</text>
  <text x="320" y="306" font-size="17" fill="#a5f3fc" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="3">UE5 · GAS 技能系统</text>
</svg>
