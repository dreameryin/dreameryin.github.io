<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.55" stop-color="#065f46"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- 网格装饰 -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="220" x2="640" y2="220"/>
    <line x1="130" y1="0" x2="130" y2="360"/>
    <line x1="510" y1="0" x2="510" y2="360"/>
  </g>

  <!-- 装饰圆环 -->
  <circle cx="320" cy="140" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 单例图标：中心唯一实例方块，三处访问点用虚线连接 -->
  <g>
    <rect x="285" y="105" width="70" height="70" rx="14" fill="#6ee7b7" stroke="#a7f3d0" stroke-width="2"/>
    <text x="320" y="155" font-size="38" font-weight="bold" fill="#064e3b" text-anchor="middle" font-family="system-ui, sans-serif">1</text>

    <rect x="130" y="85" width="26" height="26" rx="6" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="414" y="72" width="26" height="26" rx="6" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="430" y="180" width="26" height="26" rx="6" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.6"/>

    <line x1="156" y1="110" x2="285" y2="130" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.5"/>
    <line x1="427" y1="98" x2="355" y2="120" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.5"/>
    <line x1="443" y1="180" x2="355" y2="162" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.5"/>
  </g>

  <!-- 标题 -->
  <text x="320" y="268" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">设计模式</text>
  <text x="320" y="306" font-size="17" fill="#a7f3d0" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="3">单例模式 · Singleton</text>
</svg>
