<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- 网格装饰 -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="220" x2="640" y2="220"/>
    <line x1="130" y1="0" x2="130" y2="360"/>
    <line x1="510" y1="0" x2="510" y2="360"/>
  </g>

  <!-- 装饰圆环 -->
  <circle cx="320" cy="140" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 对话气泡 A（左） -->
  <g>
    <path d="M 172 132 L 158 152 L 178 132 Z" fill="url(#bubble)"/>
    <rect x="150" y="92" width="160" height="60" rx="18" fill="url(#bubble)"/>
    <circle cx="190" cy="122" r="6" fill="#6d28d9"/>
    <circle cx="215" cy="122" r="6" fill="#6d28d9"/>
    <circle cx="240" cy="122" r="6" fill="#6d28d9"/>
  </g>

  <!-- 对话气泡 B（右） -->
  <g>
    <path d="M 468 188 L 482 208 L 462 188 Z" fill="url(#bubble)"/>
    <rect x="330" y="150" width="160" height="60" rx="18" fill="url(#bubble)"/>
    <circle cx="370" cy="180" r="6" fill="#6d28d9"/>
    <circle cx="395" cy="180" r="6" fill="#6d28d9"/>
    <circle cx="420" cy="180" r="6" fill="#6d28d9"/>
  </g>

  <!-- 标题 -->
  <text x="320" y="268" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">人工智能</text>
  <text x="320" y="306" font-size="17" fill="#c7d2fe" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="3">AI · 游戏 NPC 对话</text>
</svg>
