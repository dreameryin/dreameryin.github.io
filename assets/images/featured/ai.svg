<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0618"/><stop offset="0.55" stop-color="#2a1a5e"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- PCB 走线（直角折线） -->
  <g stroke="#a78bfa" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M290 160 L210 160 L210 100"/>
    <path d="M350 160 L430 160 L430 110"/>
    <path d="M290 200 L190 200 L190 260"/>
    <path d="M350 200 L450 200 L450 250"/>
    <path d="M320 155 L320 85"/>
    <path d="M320 205 L320 275"/>
    <path d="M270 130 L150 130 L150 70"/>
    <path d="M370 130 L490 130 L490 70"/>
    <path d="M270 230 L150 230 L150 290"/>
    <path d="M370 230 L490 230 L490 290"/>
  </g>

  <!-- 走线末端焊点 -->
  <g fill="#c4b5fd">
    <circle cx="210" cy="100" r="6"/><circle cx="430" cy="110" r="6"/>
    <circle cx="190" cy="260" r="6"/><circle cx="450" cy="250" r="6"/>
    <circle cx="320" cy="85" r="6"/><circle cx="320" cy="275" r="6"/>
    <circle cx="150" cy="70" r="6"/><circle cx="490" cy="70" r="6"/>
    <circle cx="150" cy="290" r="6"/><circle cx="490" cy="290" r="6"/>
  </g>

  <!-- 中央芯片 -->
  <rect x="290" y="155" width="60" height="50" rx="6" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2.5"/>
  <rect x="302" y="167" width="36" height="26" rx="3" fill="none" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- 引脚 -->
  <g stroke="#c4b5fd" stroke-width="3">
    <line x1="290" y1="165" x2="272" y2="165"/><line x1="290" y1="180" x2="272" y2="180"/><line x1="290" y1="195" x2="272" y2="195"/>
    <line x1="350" y1="165" x2="368" y2="165"/><line x1="350" y1="180" x2="368" y2="180"/><line x1="350" y1="195" x2="368" y2="195"/>
  </g>

  <!-- 发光芯片核心 -->
  <circle cx="320" cy="180" r="8" fill="#ede9fe"/>
  <circle cx="320" cy="180" r="16" fill="#a78bfa" fill-opacity="0.3"/>
</svg>
